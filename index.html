            color: #0078d4;
            margin-top: 0;

        }

            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .doc-link {
            display: inline-block;
            padding: 12px 24px;
            background: #0078d4;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .doc-link:hover {
            background: #005a9e;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 0.9rem;
